<!-- Upload Component -->
<div class="row mb-4">
  <div class="col-md-8 offset-md-2">
    <div class="card shadow-sm border-0">
      <div class="card-body text-center">
        {% if error and not is_not_ric %}
          <div class="alert alert-danger text-center">
            {{ error }}
          </div>
        {% endif %}
        <form method="POST" enctype="multipart/form-data">
          <h5 class="mb-4">{{ texts.upload_label }}</h5>
          
          <div class="upload-area mb-4">
            <label for="fileInput" class="upload-label">
              <i class="bi bi-cloud-upload-fill mb-2" style="font-size: 2rem; color: #6c757d;"></i>
              <p class="mb-1">{{ texts.choose_file if texts.choose_file else 'Pilih Gambar' }}</p>
              <p class="text-muted small mb-0">{{ texts.no_file_selected if texts.no_file_selected else 'Belum ada gambar terunggah' }}</p>
            </label>
            <input type="file" name="file" id="fileInput" class="form-control d-none" accept="image/*" required>
          </div>
          
          <button type="submit" class="btn btn-success px-5 py-2">
            <i class="bi bi-magic"></i> {{ texts.predict_btn }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
