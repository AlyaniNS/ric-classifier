<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if current_lang == 'en' %}RIC Classification{% else %}Klasifikasi Kode Resin{% endif %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flag-icons@6.11.0/css/flag-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    #result { scroll-margin-top: 100px; }
  </style>
</head>
<body class="d-flex flex-column h-100">
<div class="container py-5 flex-grow-1">

  <!-- Header Component -->
  {% include 'components/header.html' %}

  <!-- Upload Component -->
  {% include 'components/upload.html' %}

  <!-- Classification Result Component (Always show prediction, no exceptions) -->
  {% include 'components/classification_result.html' %}

</div>

<!-- Footer Component -->
{% include 'components/footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

{% if prediction or is_not_ric %}
<script>
  // Smooth scroll to result and animate progress bars
  window.onload = function () {
    document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    
    // Animate progress bars
    setTimeout(function() {
      const progressBars = document.querySelectorAll('.animated-bar');
      progressBars.forEach((bar, index) => {
        setTimeout(() => {
          const targetWidth = bar.getAttribute('data-width') + '%';
          bar.style.width = targetWidth;
        }, index * 150); // Stagger the animations
      });
    }, 500); // Start animations after scroll
  };
</script>
{% endif %}

<script>
  // File input preview
  const fileInput = document.querySelector('input[type="file"]');
  if (fileInput) {
    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          // Add preview functionality if needed
        };
        reader.readAsDataURL(file);
      }
    });
  }

  // Add loading state to predict button
  const form = document.querySelector('form');
  const predictBtn = document.querySelector('button[type="submit"]');
  
  if (form && predictBtn) {
    form.addEventListener('submit', function() {
      predictBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> {{ texts.processing }}';
      predictBtn.disabled = true;
    });
  }
</script>
</body>
</html>
