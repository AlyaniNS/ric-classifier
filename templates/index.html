<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resin Code Classifier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="text-center mb-4">Resin Code Classifier (Few-Shot Learning)</h1>
    <div class="card p-4 shadow-sm">
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="file" class="form-label">Upload an image:</label>
                <input type="file" class="form-control" name="file" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Predict</button>
        </form>
    </div>

    {% if prediction %}
        <div class="mt-4">
            <h3>Predicted Class: {{ prediction }}</h3>
            <img src="data:image/png;base64,{{ chart }}" class="img-fluid mt-3"/>
        </div>
    {% endif %}
</div>
</body>
</html>
